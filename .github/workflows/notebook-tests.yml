name: Data analysis notebook checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  notebook-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
